[project]
name = "floodplain"
version = "0.1.0"
description = "Test a release against the packages that depend on it, in forked Nebius Sandboxes, and let a Nemotron agent fix what it breaks."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jonathan Andrei", email = "jon_andrei04@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.7.0,<3",
    "packaging>=24",
    "openai>=3.0.0,<4",
    "contree-sdk>=0.3.6",
    "tavily-python>=0.8",
    "pydantic>=2.7,<3",
]

[project.scripts]
floodplain = "floodplain.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
