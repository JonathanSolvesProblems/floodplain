name: Watch openai releases

# Every day, check PyPI for openai releases the watcher has not seen. For each one, run the
# dependents' own test suites in forked Nebius Sandboxes, let the Nemotron agent fix what broke,
# open an issue in this repository with the report, and commit the results and the watch state.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Check every unchecked release, not just the newest"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Run the watcher
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          NEBIUS_PROJECT_ID: ${{ secrets.NEBIUS_PROJECT_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: uv run floodplain watch --target openai --repo "${{ github.repository }}" ${{ inputs.all && '--all' || '' }}
      - name: Commit the results and the watch state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || { git commit -m "Watcher: results for the newest openai release"; git push; }
